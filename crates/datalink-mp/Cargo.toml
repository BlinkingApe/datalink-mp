[package]
name = "datalink-mp"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "datalink-mp"
path = "src/main.rs"

[dependencies]
ipc-protocol = { path = "../ipc-protocol" }
iroh-transport = { path = "../iroh-transport" }
dp-types = { path = "../dp-types" }
tokio = { workspace = true, features = ["net", "io-util", "fs", "process", "rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
getrandom = { version = "0.3", features = ["std"] }
subtle = "2.6.1"
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
tower = { version = "0.5", default-features = false }
sha2 = "0.11"
data-encoding = { workspace = true }

[target.'cfg(windows)'.dependencies]
# ShellExecuteW opens the browser. Not the `open` crate: it spawns a hidden PowerShell.
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# Tests build Tickets by hand: one with no addresses, one naming a silent address.
iroh = { workspace = true }
tower = { version = "0.5", default-features = false, features = ["util"] }

[build-dependencies]
embed-resource = "3"

[target.'cfg(unix)'.dev-dependencies]
# One test takes file descriptors away from its process, so that no Transport can be created.
libc = "0.2"
