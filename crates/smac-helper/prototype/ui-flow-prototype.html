<!doctype html>
<!--
  PROTOTYPE, throwaway. Answers: "UI flow: Host/Join toggle or one screen?"
  (.scratch/web-ui-v1/issues/06-ui-flow-prototype.md)

  Three variants of the smac-helper page, switchable via ?variant=A|B|C
  (or the bottom bar / arrow keys). Everything is stubbed in memory; the
  "Scenario" panel on the right forces OS, setup check, DLL, peers and banners.

  A: Host / Join toggle (ADR-0001 draft)
  B: One screen: your Ticket always shown + paste a friend's Ticket
  C: Numbered steps (setup -> Ticket -> in the game -> playing)

  Open by double-clicking. No build, no server.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smac-helper (prototype)</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1c2330; --muted: #5d6778; --line: #dde1e8;
    --accent: #1f6feb; --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e;
    --okbg: #dafbe1; --warnbg: #fff8c5; --badbg: #ffebe9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1419; --card: #182029; --ink: #e6edf3; --muted: #8d98a8; --line: #2b3440;
      --accent: #4c8dff; --ok: #3fb950; --warn: #d29922; --bad: #f85149;
      --okbg: #12301c; --warnbg: #332a0e; --badbg: #3a1418;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding-bottom: 80px; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 12px 0; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .spread { justify-content: space-between; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 7px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  input.ticket, textarea.ticket { width: 100%; font: 12px/1.4 ui-monospace, Consolas, monospace;
    border: 1px solid var(--line); border-radius: 7px; padding: 8px; background: var(--bg); color: var(--ink); }
  textarea.ticket { resize: vertical; min-height: 54px; }
  code, .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  .pill { display: inline-block; border-radius: 99px; padding: 1px 9px; font-size: 12px; font-weight: 600; }
  .pill.ok { background: var(--okbg); color: var(--ok); }
  .pill.warn { background: var(--warnbg); color: var(--warn); }
  .pill.bad { background: var(--badbg); color: var(--bad); }
  .pill.idle { background: var(--line); color: var(--muted); }
  .banner { border-radius: 10px; padding: 12px 14px; margin: 12px 0; border: 1px solid; }
  .banner.bad { background: var(--badbg); border-color: var(--bad); }
  .banner.warn { background: var(--warnbg); border-color: var(--warn); }
  .banner b { display: block; margin-bottom: 2px; }
  .tabs { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .tabs button { flex: 1; border: 0; border-radius: 0; padding: 10px; font-weight: 600; }
  .tabs button.on { background: var(--accent); color: #fff; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; }
  .step { display: grid; grid-template-columns: 30px 1fr; gap: 10px; margin: 14px 0; }
  .num { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700;
    border: 2px solid var(--line); color: var(--muted); }
  .num.done { background: var(--ok); border-color: var(--ok); color: #fff; }
  .num.now { border-color: var(--accent); color: var(--accent); }
  .ingame { border-left: 3px solid var(--accent); padding: 4px 0 4px 10px; margin: 8px 0; }
  details summary { cursor: pointer; font-weight: 600; }
  .copyline { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
  .copyline code { flex: 1; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; overflow-x: auto; white-space: nowrap; }
  .statusbar { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
  .statusbar .inner { max-width: 640px; margin: 0 auto; padding: 8px 16px; }
  .quit-overlay { position: fixed; inset: 0; background: var(--bg); display: grid; place-items: center; z-index: 50; text-align: center; }

  /* ---- prototype chrome: NOT part of the design ---- */
  .proto-bar { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 100;
    background: #111; color: #fff; border-radius: 99px; padding: 6px 8px; display: flex; gap: 8px; align-items: center;
    box-shadow: 0 6px 24px rgba(0,0,0,.35); font: 13px system-ui; }
  .proto-bar button { background: #333; color: #fff; border: 0; border-radius: 99px; padding: 4px 12px; }
  .proto-panel { position: fixed; top: 10px; right: 10px; z-index: 100; width: 250px; max-height: calc(100vh - 90px); overflow: auto;
    background: #111; color: #ddd; border-radius: 10px; padding: 10px; font: 12px system-ui; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
  .proto-panel label { display: flex; justify-content: space-between; gap: 6px; margin: 4px 0; }
  .proto-panel select, .proto-panel button { font: 12px system-ui; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 5px; padding: 2px 6px; }
  .proto-panel pre { white-space: pre-wrap; word-break: break-all; background: #000; padding: 6px; border-radius: 6px; font-size: 10.5px; }
  .proto-panel.collapsed > :not(.proto-head) { display: none; }
  .proto-head { display: flex; justify-content: space-between; font-weight: 700; color: #fff; }
  @media (max-width: 1000px) { .proto-panel { opacity: .95; } }
</style>
</head>
<body>
<div id="app"></div>

<div class="proto-panel" id="panel"></div>
<div class="proto-bar">
  <button onclick="cycle(-1)">&larr;</button>
  <span id="vlabel"></span>
  <button onclick="cycle(1)">&rarr;</button>
</div>

<script>
// ---------------------------------------------------------------- stub state
const VARIANTS = { A: 'Host / Join toggle', B: 'One screen', C: 'Numbered steps' };
const VERSION = { release: '0.3.0', ipc: 2, peer: 4 };
const SAMPLE_OK = 'endpointadr6q3kzm7w2xhuyxkqgv4p5ilmr2c7zqfnb4sg3dq2y7klwmpn5pqaaeaqcaiba';
const SAMPLE_UNREACHABLE = 'endpointbbq7xl2zz4k5v6n7m8p9q0r1s2t3u4v5w6x7y8z9a0b1c2d3e4f5g6h7';

function randTicket() {
  const a = 'abcdefghijklmnopqrstuvwxyz234567'; let s = 'endpoint';
  for (let i = 0; i < 64; i++) s += a[Math.floor(Math.random() * 32)];
  return s;
}
function shortId() { return Math.random().toString(16).slice(2, 10); }

const S = {
  os: 'windows',          // windows | linux | mac
  setupOk: true,          // startup self-check: dplayx.dll + thinker.exe / terran_PRACX.exe
  session: 'idle',        // idle | hosting | joining | joined   (what the Helper is doing)
  dll: false,             // game's DLL connected over IPC
  peers: [],              // short endpoint IDs
  banner: null,           // ipc | peer | invalid | unreachable | port
  ticket: randTicket(),   // our Ticket; a fresh Transport (after Stop) gets a new one
  friendTicket: '',
  tab: 'host',            // variant A only
  copied: null,
  quit: false,
};

const BANNERS = {
  ipc:   ['bad',  'The game\u2019s dplayx.dll doesn\u2019t match this Helper',
          'Re-extract the whole archive into your game folder (overwrite when asked), then restart the game and the Helper.'],
  peer:  ['bad',  'Your friend has a different release',
          'You have 0.3.0, your friend has 0.2.1. You both need the same release. Download it from the Releases page.'],
  invalid: ['warn', 'That isn\u2019t a Ticket',
          'Copy the whole Ticket your friend sent (it starts with <code>endpoint</code>) and paste it again.'],
  unreachable: ['bad', 'Can\u2019t reach your friend\u2019s Helper',
          'Check their Helper is still open. If they pressed Stop or restarted it, their Ticket changed: ask for the new one.'],
  port:  ['bad',  'Port 47624 is already in use',
          'Another smac-helper is probably already running. Close it (check other console/Terminal windows), then start this one again.'],
};

function isTicket(t) { return /^endpoint[a-z2-7]{40,}$/.test(t.trim()); }

// ---------------------------------------------------------------- actions (stubs)
const act = {
  host() { S.session = 'hosting'; S.banner = null; render(); },
  connect() {
    const t = S.friendTicket.trim();
    if (!isTicket(t)) { S.banner = 'invalid'; return render(); }
    if (t === S.ticket) { S.banner = 'invalid'; return render(); }
    S.banner = null; S.session = 'joining'; render();
    setTimeout(() => {
      if (S.session !== 'joining') return;
      if (t === SAMPLE_UNREACHABLE) { S.session = 'idle'; S.banner = 'unreachable'; }
      else { S.session = 'joined'; S.peers = [shortId()]; }
      render();
    }, 1800);
  },
  stop() { S.session = 'idle'; S.peers = []; S.banner = null; S.ticket = randTicket(); S.friendTicket = ''; render(); },
  quit() { if (confirm('Quit smac-helper? Anyone connected through you will be disconnected.')) { S.quit = true; render(); } },
  copy(what, text) {
    try { navigator.clipboard.writeText(text); } catch (e) {}
    S.copied = what; render(); setTimeout(() => { S.copied = null; render(); }, 1200);
  },
  tab(t) { S.tab = t; S.banner = null; render(); },
  dismiss() { S.banner = null; render(); },
  paste(v) { S.friendTicket = v; render(); },
};
function onTicketInput(el) {
  S.friendTicket = el.value;
  const b = document.getElementById('connectBtn');
  if (b) b.disabled = !S.friendTicket.trim();
  dumpState();
}

// ---------------------------------------------------------------- shared bits
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function copyBtn(what, text, label = 'Copy') {
  return `<button onclick="act.copy('${what}', ${esc(JSON.stringify(text))})">${S.copied === what ? 'Copied \u2713' : label}</button>`;
}
function bannerHtml() {
  if (!S.banner) return '';
  const [kind, title, body] = BANNERS[S.banner];
  return `<div class="banner ${kind}"><div class="row spread"><b>${title}</b>
    <button class="small" onclick="act.dismiss()">\u00d7</button></div><div>${body}</div></div>`;
}
function setupBannerHtml() {
  if (S.setupOk) return '';
  return `<div class="banner bad"><b>This isn\u2019t your game folder</b>
    Couldn\u2019t find <code>dplayx.dll</code> and <code>thinker.exe</code> or <code>terran_PRACX.exe</code> next to the Helper.
    Extract the whole archive into the folder that contains your game (the one with <code>terran.exe</code>), then run the Helper from there.
    <div class="small muted" style="margin-top:6px">Helper is running from: <code>C:\\Users\\sam\\Downloads\\smac-helper-0.3.0</code></div></div>`;
}
function stateWord() {
  return { idle: 'Ready', hosting: 'Hosting', joining: 'Connecting\u2026', joined: 'Joined' }[S.session];
}
function statePill() {
  const cls = S.session === 'joining' ? 'warn' : (S.session === 'idle' ? 'idle' : 'ok');
  return `<span class="pill ${cls}">${stateWord()}</span>`;
}
function dllPill() {
  return S.dll ? `<span class="pill ok">Game connected</span>` : `<span class="pill idle">Game not running</span>`;
}
function peersText() {
  if (!S.peers.length) return '<span class="muted">none yet</span>';
  return `${S.peers.length} \u2014 ` + S.peers.map(p => `<code>${p}</code>`).join(', ');
}
function versionLine() {
  return `Release ${VERSION.release} <span class="small muted">(IPC v${VERSION.ipc} \u00b7 Peer protocol v${VERSION.peer})</span>`;
}
function keepOpenText() {
  return { windows: 'Keep this browser tab and the console window open while you play.',
           linux: 'Keep this browser tab open while you play (closing it doesn\u2019t stop the Helper; Quit does).',
           mac: 'Keep this tab and the Terminal window open while you play.' }[S.os];
}
function headerHtml(extra = '') {
  return `<div class="row spread"><div><h1>smac-helper</h1><div class="small muted">${versionLine()}</div></div>
    <div class="row">${extra}<button class="danger" onclick="act.quit()">Quit</button></div></div>`;
}
function ingameHtml(role) {
  // role: host | join | either
  const pick = role === 'host' ? '<b>Host Game</b>' : role === 'join' ? '<b>Join Game</b>' : '<b>Host Game</b> (you) or <b>Join Game</b> (your friends)';
  return `<div class="ingame">In the game: <b>Multiplayer</b> \u2192 <b>Iroh P2P</b> \u2192 ${pick}.</div>`;
}
function wineSetupHtml(open) {
  if (S.os === 'windows') return '';
  const generic = 'WINEDLLOVERRIDES=dplayx=n,b';
  const steam = 'WINEDLLOVERRIDES="dplayx=n,b" %command%';
  const linuxExtra = S.os === 'linux' ? `
      <div class="small" style="margin-top:8px"><b>Faugus Launcher:</b> edit the game \u2192 paste into <b>Game Arguments</b>.</div>
      <div class="copyline"><code>${generic}</code>${copyBtn('faugus', generic)}</div>
      <div class="small"><b>Steam</b> <span class="muted">(should work, untested)</span>: game Properties \u2192 Launch Options.</div>
      <div class="copyline"><code>${esc(steam)}</code>${copyBtn('steam', steam)}</div>` : '';
  return `<details class="card" ${open ? 'open' : ''}><summary>Wine setup (one time)</summary>
      <p class="small">Wine uses its own dplayx.dll unless you tell it to use ours. Add this to your launcher\u2019s environment:</p>
      <div class="copyline"><code>${generic}</code>${copyBtn('generic', generic)}</div>
      ${linuxExtra}
      <div class="small muted">If the game never shows \u201cGame connected\u201d above, this override is the usual culprit.</div>
    </details>`;
}
function statusGrid() {
  return `<div class="kv small">
      <span class="muted">State</span><span>${statePill()}</span>
      <span class="muted">Game</span><span>${dllPill()}</span>
      <span class="muted">Peers</span><span>${peersText()}</span>
      <span class="muted">Version</span><span>${versionLine()}</span></div>`;
}
function stopBtn() {
  return S.session === 'idle' ? '' : `<button onclick="act.stop()">Stop</button>`;
}

// ---------------------------------------------------------------- Variant A: Host / Join toggle
function VariantA() {
  const inSession = S.session !== 'idle';
  const tabs = `<div class="tabs">
      <button class="${S.tab === 'host' ? 'on' : ''}" ${inSession ? 'disabled' : ''} onclick="act.tab('host')">Host a game</button>
      <button class="${S.tab === 'join' ? 'on' : ''}" ${inSession ? 'disabled' : ''} onclick="act.tab('join')">Join a friend</button></div>`;
  let body;
  if (S.tab === 'host') {
    body = S.session === 'hosting'
      ? `<h2>Send this Ticket to your friends</h2>
         <input class="ticket" readonly value="${S.ticket}" onclick="this.select()">
         <div class="row" style="margin-top:8px">${copyBtn('ticket', S.ticket, 'Copy Ticket')}${stopBtn()}</div>
         ${ingameHtml('host')}`
      : `<p>Start hosting to get a Ticket you can send to friends.</p>
         <button class="primary" ${S.setupOk ? '' : 'disabled'} onclick="act.host()">Start hosting</button>`;
  } else {
    body = S.session === 'joined' || S.session === 'joining'
      ? `<p>${S.session === 'joining' ? 'Connecting to your friend\u2026' : 'Connected to your friend\u2019s Helper.'}</p>
         <div class="row">${stopBtn()}</div>${S.session === 'joined' ? ingameHtml('join') : ''}`
      : `<h2>Paste your friend\u2019s Ticket</h2>
         <textarea class="ticket" placeholder="endpoint\u2026" oninput="onTicketInput(this)">${esc(S.friendTicket)}</textarea>
         <div class="row" style="margin-top:8px"><button id="connectBtn" class="primary" ${S.friendTicket.trim() && S.setupOk ? '' : 'disabled'} onclick="act.connect()">Join</button></div>`;
  }
  return `<main>${headerHtml()}${setupBannerHtml()}${bannerHtml()}
    <div class="card">${tabs}<div style="margin-top:14px">${body}</div></div>
    <div class="card"><h2>Status</h2>${statusGrid()}</div>
    ${wineSetupHtml(false)}
    <p class="small muted">${keepOpenText()}</p></main>`;
}

// ---------------------------------------------------------------- Variant B: One screen
function VariantB() {
  const connected = S.session === 'joined';
  const joining = S.session === 'joining';
  const bar = `<div class="statusbar"><div class="inner row spread">
      <div class="row">${statePill()} ${dllPill()} <span class="small muted">Peers: ${peersText()}</span></div>
      <div class="row">${stopBtn()}<button class="danger" onclick="act.quit()">Quit</button></div></div></div>`;
  const friend = connected || joining
    ? `<div class="card"><h2>Friend\u2019s Ticket</h2>
         <p>${joining ? 'Connecting\u2026' : 'Connected \u2713 You\u2019re joining their game.'}</p>
         <input class="ticket" readonly value="${esc(S.friendTicket.trim())}"></div>`
    : `<div class="card"><h2>Joining a friend? Paste their Ticket</h2>
         <textarea class="ticket" placeholder="endpoint\u2026" oninput="onTicketInput(this)">${esc(S.friendTicket)}</textarea>
         <div class="row" style="margin-top:8px"><button id="connectBtn" class="primary" ${S.friendTicket.trim() && S.setupOk ? '' : 'disabled'} onclick="act.connect()">Connect</button>
         <span class="small muted">Hosting? Skip this; your friends paste <i>your</i> Ticket.</span></div></div>`;
  return `${bar}<main>
    <div><h1>smac-helper</h1><div class="small muted">${versionLine()}</div></div>
    ${setupBannerHtml()}${bannerHtml()}
    <div class="card"><h2>Your Ticket</h2>
      <p class="small muted" style="margin-top:0">Hosting? Send this to your friends. It changes if you press Stop or restart the Helper.</p>
      <input class="ticket" readonly value="${S.ticket}" onclick="this.select()">
      <div class="row" style="margin-top:8px">${copyBtn('ticket', S.ticket, 'Copy Ticket')}</div></div>
    ${friend}
    <div class="card"><h2>Then, in the game</h2>
      ${ingameHtml(connected ? 'join' : 'either')}
      <div class="small muted">${S.dll ? 'The game is connected to the Helper \u2713' : 'When the game reaches that menu, \u201cGame connected\u201d lights up at the top.'}</div></div>
    ${wineSetupHtml(!S.dll)}
    <p class="small muted">${keepOpenText()}</p></main>`;
}

// ---------------------------------------------------------------- Variant C: Numbered steps
function VariantC() {
  const stepState = (done, now) => done ? 'done' : (now ? 'now' : '');
  const s1done = S.setupOk;
  const s2done = S.session === 'joined' || S.peers.length > 0;
  const s3done = S.dll;
  const s4now = s1done && s3done;
  const setup = S.setupOk
    ? `<div class="small"><span class="pill ok">Game folder OK</span> Found <code>dplayx.dll</code> and <code>terran_PRACX.exe</code>.</div>
       ${S.os === 'windows' ? '' : wineSetupHtml(false).replace('class="card"', 'style="margin-top:6px"')}`
    : setupBannerHtml();
  const ticketStep = S.session === 'joined' || S.session === 'joining'
    ? `<p>${S.session === 'joining' ? 'Connecting to your friend\u2026' : 'Connected to your friend \u2713'}</p>`
    : `<div class="row" style="gap:16px; align-items:flex-start">
         <div style="flex:1; min-width:220px"><b>Hosting:</b> send your Ticket
           <input class="ticket" readonly value="${S.ticket}" onclick="this.select()" style="margin-top:4px">
           <div style="margin-top:6px">${copyBtn('ticket', S.ticket, 'Copy Ticket')}</div></div>
         <div style="flex:1; min-width:220px"><b>Joining:</b> paste your friend\u2019s
           <textarea class="ticket" placeholder="endpoint\u2026" oninput="onTicketInput(this)" style="margin-top:4px">${esc(S.friendTicket)}</textarea>
           <div style="margin-top:6px"><button id="connectBtn" class="primary" ${S.friendTicket.trim() && S.setupOk ? '' : 'disabled'} onclick="act.connect()">Connect</button></div></div></div>`;
  const step = (n, cls, title, body) => `<div class="step"><div class="num ${cls}">${cls === 'done' ? '\u2713' : n}</div>
      <div><h2 style="margin-top:3px">${title}</h2>${body}</div></div>`;
  return `<main>${headerHtml(stopBtn())}${bannerHtml()}
    <div class="card">
      ${step(1, stepState(s1done, !s1done), 'Game folder', setup)}
      ${step(2, stepState(s2done, s1done && !s2done), 'Share or paste a Ticket', ticketStep)}
      ${step(3, stepState(s3done, s1done && !s3done), 'Start the game', `${ingameHtml(S.session === 'joined' ? 'join' : 'either')}
         <div class="small">${dllPill()}</div>`)}
      ${step(4, stepState(false, s4now), 'Play', `<div class="small">Peers: ${peersText()}</div>
         <div class="small muted">${keepOpenText()}</div>`)}
    </div>
    <p class="small muted">${versionLine()} \u00b7 State: ${stateWord()}</p></main>`;
}

// ---------------------------------------------------------------- prototype chrome
function variant() { const v = new URLSearchParams(location.search).get('variant'); return VARIANTS[v] ? v : 'A'; }
function setVariant(v) {
  const u = new URL(location.href); u.searchParams.set('variant', v);
  try { history.replaceState(null, '', u); } catch (e) { location.search = u.search; return; }
  render();
}
function cycle(d) { const k = Object.keys(VARIANTS); setVariant(k[(k.indexOf(variant()) + d + k.length) % k.length]); }
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});

let panelCollapsed = false;
function sel(key, opts) {
  return `<select onchange="scn('${key}', this.value)">${opts.map(([v, l]) =>
    `<option value="${v}" ${String(S[key]) === String(v) ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
}
function scn(key, v) {
  if (key === 'setupOk' || key === 'dll') v = v === 'true';
  if (key === 'banner' && v === '') v = null;
  if (key === 'session' && v === 'idle') S.peers = [];
  S[key] = v; render();
}
const sim = {
  friendJoins() { S.peers.push(shortId()); if (S.session === 'idle') S.session = 'hosting'; render(); },
  gameConnects() { S.dll = !S.dll; render(); },
  fillOk() { act.paste(SAMPLE_OK); },
  fillBad() { act.paste(SAMPLE_UNREACHABLE); },
  fillJunk() { act.paste('hey here is the code: 1234'); },
};
function panelHtml() {
  return `<div class="proto-head"><span>Scenario (prototype)</span>
      <button onclick="panelCollapsed=!panelCollapsed; render()">${panelCollapsed ? '+' : '\u2013'}</button></div>
    <label>OS ${sel('os', [['windows', 'Windows'], ['linux', 'Linux'], ['mac', 'macOS']])}</label>
    <label>Self-check ${sel('setupOk', [['true', 'OK'], ['false', 'not game folder']])}</label>
    <label>Session ${sel('session', [['idle', 'idle'], ['hosting', 'hosting'], ['joining', 'joining'], ['joined', 'joined']])}</label>
    <label>DLL ${sel('dll', [['false', 'not connected'], ['true', 'connected']])}</label>
    <label>Banner ${sel('banner', [['', 'none'], ['ipc', 'IPC mismatch'], ['peer', 'Peer mismatch'], ['invalid', 'Invalid ticket'], ['unreachable', 'Can\u2019t reach host'], ['port', 'IPC port in use']])}</label>
    <div class="row" style="margin:6px 0"><button onclick="sim.friendJoins()">+ friend joins</button><button onclick="sim.gameConnects()">toggle game</button></div>
    <div class="row" style="margin:6px 0">Paste: <button onclick="sim.fillOk()">good</button><button onclick="sim.fillBad()">unreachable</button><button onclick="sim.fillJunk()">junk</button></div>
    <pre id="dump"></pre>`;
}
function dumpState() {
  const d = document.getElementById('dump');
  if (d) d.textContent = JSON.stringify({ variant: variant(), ...S, ticket: S.ticket.slice(0, 16) + '\u2026' }, null, 1);
}

function render() {
  const app = document.getElementById('app');
  if (S.quit) {
    app.innerHTML = `<div class="quit-overlay"><div><h1>smac-helper has quit</h1>
      <p class="muted">You can close this tab. Double-click smac-helper again to start it.</p>
      <button onclick="S.quit=false; act.stop()">(prototype: restart)</button></div></div>`;
  } else {
    app.innerHTML = { A: VariantA, B: VariantB, C: VariantC }[variant()]();
  }
  document.getElementById('vlabel').textContent = `${variant()} (${VARIANTS[variant()]})`;
  const p = document.getElementById('panel');
  p.className = 'proto-panel' + (panelCollapsed ? ' collapsed' : '');
  p.innerHTML = panelHtml();
  dumpState();
}
render();
</script>
</body>
</html>
