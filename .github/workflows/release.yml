# Builds the release archives for a pushed v* tag and opens a draft GitHub
# Release with them. It never publishes: a maintainer does that by hand after
# the release gate (docs/maintainers/releasing.md, ADR-0002).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    # Explicit, so every step gets -o pipefail.
    shell: bash

jobs:
  version:
    name: Check the tag against the workspace version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: scripts/release-version.sh "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"

  ubuntu:
    name: Build the DLL, Windows and Linux archives
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 gcc-mingw-w64-x86-64 musl-tools zip
          rustup toolchain install stable --profile minimal \
            --target i686-pc-windows-gnu,x86_64-pc-windows-gnu,x86_64-unknown-linux-musl
          rustup default stable

      - name: Build the DLL
        run: |
          build() { cargo build --release --locked --target i686-pc-windows-gnu -p dplayx; }
          if build 2>&1 | tee dll-build.log; then
            exit 0
          fi
          grep -q "multiple definition of .*_Unwind_Resume" dll-build.log || exit 1
          echo "::warning::_Unwind_Resume clash on this mingw; retrying with --allow-multiple-definition"
          # Per-target, so .cargo/config.toml's rustflags still apply; bare
          # RUSTFLAGS would replace them.
          CARGO_TARGET_I686_PC_WINDOWS_GNU_RUSTFLAGS="-C link-arg=-Wl,--allow-multiple-definition" build

      - name: Build the Windows Helper
        run: cargo build --release --locked --target x86_64-pc-windows-gnu -p datalink-mp

      - name: Build the Linux Helper
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target x86_64-unknown-linux-musl -p datalink-mp

      - name: Check the binaries
        run: |
          DLL=target/i686-pc-windows-gnu/release/dplayx.dll
          EXE=target/x86_64-pc-windows-gnu/release/datalink-mp.exe
          LINUX=target/x86_64-unknown-linux-musl/release/datalink-mp
          # Each binary is read by its own target's windres: the DLL is 32-bit.
          for pair in "$DLL i686" "$EXE x86_64"; do
            read -r f arch <<< "$pair"
            echo "== $f"
            objdump -p "$f" | grep 'DLL Name' | sort -u
            if objdump -p "$f" | grep -qiE 'DLL Name: (libgcc|libwinpthread|libstdc)'; then
              echo "::error::$f links a mingw runtime DLL"; exit 1
            fi
            RC="$("$arch-w64-mingw32-windres" -J coff -i "$f" -O rc)"
            grep -E 'VALUE "(ProductName|FileVersion)"' <<< "$RC"
            grep -q "VALUE \"FileVersion\", \"$VERSION\"" <<< "$RC" \
              || { echo "::error::$f has no VERSIONINFO for $VERSION"; exit 1; }
          done
          file "$LINUX"
          file "$LINUX" | grep -q 'static' || { echo "::error::$LINUX isn't static"; exit 1; }

      - name: Pack the archives
        run: |
          # Everything but the binaries carries a datalink-mp- prefix, so
          # extracting into the Game folder can't overwrite the game's own
          # readme or licence files. The README's source is packaging/README.txt.
          COMMON=(datalink-mp-README.txt datalink-mp-LICENSE-MIT.txt
            datalink-mp-LICENSE-APACHE.txt datalink-mp-LICENSE-FONTS.txt)
          mkdir -p dist stage/windows stage/linux
          for d in stage/windows stage/linux; do
            cp packaging/README.txt "$d/datalink-mp-README.txt"
            for l in MIT APACHE FONTS; do cp "LICENSE-$l" "$d/datalink-mp-LICENSE-$l.txt"; done
          done

          cp target/x86_64-pc-windows-gnu/release/datalink-mp.exe \
            target/i686-pc-windows-gnu/release/dplayx.dll stage/windows/
          (cd stage/windows && zip -X "../../dist/datalink-mp-$VERSION-windows-x86_64.zip" \
            datalink-mp.exe dplayx.dll "${COMMON[@]}")

          cp target/x86_64-unknown-linux-musl/release/datalink-mp \
            target/i686-pc-windows-gnu/release/dplayx.dll stage/linux/
          chmod 755 stage/linux/datalink-mp
          tar -C stage/linux --owner=0 --group=0 --numeric-owner \
            -czf "dist/datalink-mp-$VERSION-linux-x86_64.tar.gz" datalink-mp dplayx.dll "${COMMON[@]}"

          ls -l dist

      # Archive names carry the version, not the tag, so an RC's archives can
      # replace the final tag's with `gh release upload --clobber`.
      - uses: actions/upload-artifact@v7
        with:
          name: archives-ubuntu
          path: dist/
          if-no-files-found: error

      - name: The DLL alone, for the macOS archive
        uses: actions/upload-artifact@v7
        with:
          name: dplayx-dll
          path: target/i686-pc-windows-gnu/release/dplayx.dll
          if-no-files-found: error

  macos:
    name: Build the macOS archive
    # Needs the Ubuntu job's DLL: one DLL, and one hash, in every archive.
    needs: [version, ubuntu]
    # arm64; not the billed -large/-xlarge runners.
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      HELPER: target/aarch64-apple-darwin/release/datalink-mp
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin
          rustup default stable

      - name: Build the macOS Helper
        run: cargo build --release --locked --target aarch64-apple-darwin -p datalink-mp

      - name: Check the signature
        run: |
          if ! codesign --verify --verbose "$HELPER"; then
            echo "::notice::codesign --verify failed; re-signing ad-hoc"
            codesign --force --sign - "$HELPER"
            codesign --verify --verbose "$HELPER"
          fi

      - uses: actions/download-artifact@v8
        with:
          name: dplayx-dll
          path: stage

      # ditto, not zip: it keeps the properties zip and upload-artifact drop,
      # the executable bit among them. The finished .zip goes to the release
      # as-is (upload-artifact wraps it, and download-artifact unwraps it).
      - name: Pack the archive
        run: |
          cp "$HELPER" stage/
          cp packaging/README.txt stage/datalink-mp-README.txt
          for l in MIT APACHE FONTS; do cp "LICENSE-$l" "stage/datalink-mp-LICENSE-$l.txt"; done
          chmod 755 stage/datalink-mp
          mkdir dist
          ARCHIVE="dist/datalink-mp-$VERSION-macos-aarch64.zip"
          ditto -c -k --norsrc --noextattr --noacl stage "$ARCHIVE"
          zipinfo "$ARCHIVE"
          ditto -x -k "$ARCHIVE" unpacked
          test -x unpacked/datalink-mp || { echo "::error::the Helper lost its executable bit"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: archives-macos
          path: dist/
          if-no-files-found: error

  release:
    name: Draft the GitHub Release
    needs: [version, ubuntu, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: archives-*
          merge-multiple: true
          path: dist

      - name: Check one DLL in every archive
        run: |
          mkdir dlls
          unzip -p dist/*-windows-x86_64.zip dplayx.dll > dlls/windows
          tar -xzOf dist/*-linux-x86_64.tar.gz dplayx.dll > dlls/linux
          unzip -p dist/*-macos-aarch64.zip dplayx.dll > dlls/macos
          sha256sum dlls/*
          [[ $(sha256sum dlls/* | cut -d' ' -f1 | sort -u | wc -l) -eq 1 ]] \
            || { echo "::error::the archives hold different DLLs"; exit 1; }

      - name: Write SHA256SUMS
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" dist/attestation.sigstore.json
          CHANGES=""
          [[ -f "docs/release-notes/$VERSION.md" ]] && CHANGES="$(cat "docs/release-notes/$VERSION.md")"$'\n\n'
          NOTES="$CHANGES$(cat <<EOF
          - Windows: \`datalink-mp-$VERSION-windows-x86_64.zip\`
          - Linux (static, any x86_64 distro): \`datalink-mp-$VERSION-linux-x86_64.tar.gz\`
          - macOS (Apple silicon): \`datalink-mp-$VERSION-macos-aarch64.zip\`. Built in CI and untested: nobody has run it on a Mac.

          Archives built by CI from $GITHUB_REF_NAME ($GITHUB_SHA), run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID.

          Verify a download:

              sha256sum -c SHA256SUMS --ignore-missing
              gh attestation verify <archive> -R $GITHUB_REPOSITORY
          EOF
          )"
          FLAGS=(--draft --verify-tag --title "datalink-mp $VERSION" --notes "$NOTES")
          [[ "$PRERELEASE" == true ]] && FLAGS+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" "${FLAGS[@]}" dist/*
