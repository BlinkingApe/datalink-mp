# Cross-compilation settings for the 32-bit Windows DLL (dplayx.dll).
#
# Building `-p dplayx --target i686-pc-windows-gnu` requires the mingw-w64
# toolchain (macOS: `brew install mingw-w64`; Debian/Ubuntu:
# `apt install gcc-mingw-w64-i686`) and the Rust target
# (`rustup target add i686-pc-windows-gnu`).

[target.i686-pc-windows-gnu]
linker = "i686-w64-mingw32-gcc"
ar = "i686-w64-mingw32-ar"
rustflags = [
    "-C", "link-arg=-lws2_32",
    # The game is a 1999 binary; control-flow-guard metadata confuses some
    # Wine builds when the DLL is loaded into it.
    "-C", "control-flow-guard=no",
]

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"
